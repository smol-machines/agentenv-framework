name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: smol
    steps:
      - run: |
          echo "argv0: $(bash -c 'echo $0')"
          echo "containerd sock: $(ls /run/containerd/containerd.sock 2>&1)"
          echo "shim tail: $(tail -1 /usr/local/bin/bash)"
          echo "guest: $(/usr/local/bin/smolci-guest --version 2>&1 | head -1)"
